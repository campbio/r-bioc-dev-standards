# Reusable workflow: fails a pull request aimed at a package's stable
# branch, which sync-stable.yaml keeps as a copy of the current Bioconductor
# release. Packages don't copy this file; they call it from a short
# workflow (templates/github/workflows/pr-base-devel.yaml) that runs on pull
# requests to main or master. It never runs in this repo.

name: PR base branch

on:
  workflow_call:

jobs:
  wrong-base:
    runs-on: ubuntu-latest
    # It only prints an error, so its token gets no permissions.
    permissions: {}
    steps:
      - run: |
          echo "::error::Pull requests must target devel (or a RELEASE_X_Y branch for release fixes, or a refactor/<topic> branch for a piece of a refactor)."
          echo "::error::The ${{ github.base_ref }} branch is updated automatically from the current Bioconductor release."
          echo "::error::To fix: click Edit next to the PR title and change the base branch to devel (or the refactor branch)."
          exit 1
